<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#2b2d31;--panel:#34373c;--bubble:#3f4349;--line:#4a4e55;--text:#e4e6ea;--muted:#9aa0a8;--accent:#8e96a3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.55;display:flex;flex-direction:column}
header{padding:16px 24px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px;letter-spacing:.2px}
header span{color:var(--muted);font-weight:400;font-size:14px;margin-left:10px}
#log{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.row{width:100%;max-width:760px;display:flex}
.row.you{justify-content:flex-end}
.msg{padding:12px 16px;border-radius:12px;max-width:100%}
.you .msg{background:var(--accent);color:#1d1f22}
.bot .msg{background:var(--panel);border:1px solid var(--line)}
.msg p{margin:.5em 0}.msg p:first-child{margin-top:0}.msg p:last-child{margin-bottom:0}
.msg ol,.msg ul{padding-left:1.4em;margin:.5em 0}
.msg hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.msg code{background:var(--bubble);padding:1px 5px;border-radius:4px}
.msg pre{background:var(--bubble);padding:10px;border-radius:8px;overflow-x:auto}
.katex-display{overflow-x:auto;overflow-y:hidden}
.empty{margin:auto;color:var(--muted);text-align:center}
.dock{padding:12px 16px 20px;display:flex;justify-content:center}
.field{width:100%;max-width:760px;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:16px Arial,Helvetica,sans-serif;padding:6px 8px;min-width:0}
button{background:var(--accent);color:#1d1f22;border:0;border-radius:8px;padding:8px 18px;font:700 15px Arial,Helvetica,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.tag{margin-top:10px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header>Math Assistant<span>ask any math question</span></header>
<div id="log"><div class="empty" id="empty">Type a math problem below.<br>Example: Solve 2x² − 5x + 3 = 0</div></div>
<div class="dock"><div class="field"><input id="q" placeholder="Ask a math question..." autocomplete="off"><button id="go">Send</button></div></div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(t){
 if(typeof marked==='undefined'||typeof katex==='undefined'){return esc(t).replace(/\n/g,'<br>')}
 const M=[];
 t=t.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)/g,(m,a,b,c)=>{const d=a!==undefined||b!==undefined;M.push({tex:(a??b??c).trim(),d});return '@@M'+(M.length-1)+'@@'});
 const html=marked.parse(esc(t),{breaks:true});
 return html.replace(/@@M(\d+)@@/g,(m,i)=>katex.renderToString(M[i].tex,{displayMode:M[i].d,throwOnError:false}));
}
function add(cls,html){const r=document.createElement('div');r.className='row '+cls;r.innerHTML='<div class="msg">'+html+'</div>';log.appendChild(r);log.scrollTop=log.scrollHeight;return r}
async function ask(){
 const text=q.value.trim();if(!text)return;
 const e=document.getElementById('empty');if(e)e.remove();
 add('you',esc(text));q.value='';go.disabled=true;
 const wait=add('bot','Thinking...');
 try{
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.detail||'Server error');
  let tag='';
  if(d.analysis){tag='<div class="tag">Topic: '+esc(d.analysis.topic)+' · Difficulty: '+d.analysis.level+'/5</div>'}
  wait.querySelector('.msg').innerHTML=fmt(d.answer)+tag;
 }catch(err){wait.querySelector('.msg').textContent='Error: '+err.message}
 go.disabled=false;log.scrollTop=log.scrollHeight;q.focus();
}
go.onclick=ask;
q.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script>
</body>
</html>
