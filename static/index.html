<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#1e1f22;--side:#17181a;--panel:#2b2d31;--hover:#26282c;--line:#3a3d43;--text:#e6e8eb;--muted:#8d949e;--accent:#b4bcc9;--on-accent:#1b1c1f;--danger:#d97777}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6}
.app{display:flex;height:100%}
button{font-family:inherit;cursor:pointer}
/* sidebar */
#side{width:268px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;flex:none;transition:transform .2s}
.logo{font-weight:700;font-size:18px;padding:6px 8px 14px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
#new{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px}
#new:hover{background:var(--hover);border-color:var(--muted)}
.label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:18px 8px 6px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:8px;padding:0 4px 0 10px}
.item:hover{background:var(--hover)}
.item.on{background:var(--panel)}
.item .t{flex:1;background:none;border:0;color:var(--text);text-align:left;padding:9px 0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:6px 8px;border-radius:6px;opacity:0}
.item:hover .x,.item.on .x{opacity:1}
.item .x:hover{color:var(--danger)}
.none{color:var(--muted);font-size:13px;padding:8px 10px}
/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);min-height:54px}
#burger{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font-size:16px}
header h1{font-size:15px;margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log{flex:1;overflow-y:auto;padding:24px 16px 8px}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px}
.row.you{justify-content:flex-end}
.ava{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex:none;margin-top:2px}
.bubble{max-width:100%;min-width:0}
.you .bubble{background:var(--accent);color:var(--on-accent);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.bot .bubble{flex:1}
.bot .body{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 18px;overflow-x:auto}
.body p{margin:.5em 0}.body p:first-child{margin-top:0}.body p:last-child{margin-bottom:0}
.body ol,.body ul{padding-left:1.4em;margin:.5em 0}.body li{margin:.3em 0}
.body hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.body code{background:var(--bg);padding:1px 5px;border-radius:4px}
.body pre{background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto}
.body table{border-collapse:collapse}.body td,.body th{border:1px solid var(--line);padding:4px 8px}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.pills{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.welcome{margin:12vh auto 0;text-align:center;max-width:560px}
.welcome h2{font-size:28px;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 0 22px}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ex button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px}
.ex button:hover{border-color:var(--muted)}
/* input */
.dock{padding:10px 16px 18px}
.field{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.field:focus-within{border-color:var(--muted)}
textarea{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--text);font:16px Arial,Helvetica,sans-serif;line-height:1.5;padding:6px 8px;max-height:160px;min-width:0}
#go{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:9px 18px;font-weight:700;font-size:15px}
#go:disabled{opacity:.45;cursor:default}
.hint{max-width:760px;margin:6px auto 0;text-align:center;font-size:12px;color:var(--muted)}
#ov{display:none}
@media (max-width:760px){
 #side{position:fixed;z-index:20;top:0;bottom:0;left:0;transform:translateX(-100%)}
 body.open #side{transform:none}
 body.open #ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
 #burger{display:block}
 .ava{display:none}
}
</style>
</head>
<body>
<div class="app">
 <aside id="side">
  <div class="logo"><i></i>Math Assistant</div>
  <button id="new">+ New chat</button>
  <div class="label">History</div>
  <div id="list"></div>
 </aside>
 <div id="ov"></div>
 <main>
  <header><button id="burger" aria-label="Menu">☰</button><h1 id="title">New chat</h1></header>
  <div id="log"><div class="col" id="col"></div></div>
  <div class="dock">
   <div class="field"><textarea id="q" rows="1" placeholder="Ask a math question..."></textarea><button id="go">Send</button></div>
   <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
 </main>
</div>
<script>
const KEY='mathchats';
const log=document.getElementById('log'),col=document.getElementById('col'),q=document.getElementById('q'),go=document.getElementById('go'),list=document.getElementById('list'),titleEl=document.getElementById('title');
let chats=load(),activeId=null,busy=false;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(t){
 if(typeof marked==='undefined'||typeof katex==='undefined'){return esc(t).replace(/\n/g,'<br>')}
 const M=[];
 t=t.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)/g,(m,a,b,c)=>{const d=a!==undefined||b!==undefined;M.push({tex:(a??b??c).trim(),d});return '@@M'+(M.length-1)+'@@'});
 const html=marked.parse(esc(t),{breaks:true});
 return html.replace(/@@M(\d+)@@/g,(m,i)=>katex.renderToString(M[i].tex,{displayMode:M[i].d,throwOnError:false}));
}
function active(){return chats.find(c=>c.id===activeId)}
function newChat(){const c={id:Date.now().toString(36),title:'',messages:[]};chats.unshift(c);activeId=c.id;save();render();q.focus();document.body.classList.remove('open')}
function selectChat(id){activeId=id;render();document.body.classList.remove('open')}
function delChat(id){chats=chats.filter(c=>c.id!==id);if(activeId===id)activeId=chats[0]?chats[0].id:null;save();render()}
function renderList(){
 list.innerHTML='';
 const shown=chats.filter(c=>c.messages.length);
 if(!shown.length){const d=document.createElement('div');d.className='none';d.textContent='No chats yet';list.appendChild(d);return}
 shown.forEach(c=>{
  const it=document.createElement('div');it.className='item'+(c.id===activeId?' on':'');
  const b=document.createElement('button');b.className='t';b.textContent=c.title||'New chat';b.onclick=()=>selectChat(c.id);
  const x=document.createElement('button');x.className='x';x.textContent='×';x.title='Delete chat';x.onclick=e=>{e.stopPropagation();delChat(c.id)};
  it.append(b,x);list.appendChild(it);
 });
}
function rowHTML(m){
 if(m.role==='user')return '<div class="row you"><div class="bubble">'+esc(m.content)+'</div></div>';
 let pills='';
 if(m.analysis)pills='<div class="pills"><span class="pill">Topic: '+esc(m.analysis.topic)+'</span><span class="pill">Difficulty: '+m.analysis.level+'/5</span></div>';
 return '<div class="row bot"><div class="ava">M</div><div class="bubble"><div class="body">'+fmt(m.content)+'</div>'+pills+'</div></div>';
}
function renderChat(){
 const c=active();
 titleEl.textContent=(c&&c.title)||'New chat';
 if(!c||!c.messages.length){
  col.innerHTML='<div class="welcome"><h2>What are we solving?</h2><p>Ask any math question. Formulas are shown step by step.</p><div class="ex"></div></div>';
  ['Solve 2x² − 5x + 3 = 0','Find the derivative of sin(x)·eˣ','Probability of rolling a sum of 7 with two dice'].forEach(t=>{
   const b=document.createElement('button');b.textContent=t;b.onclick=()=>{q.value=t;send()};col.querySelector('.ex').appendChild(b)});
  return;
 }
 col.innerHTML=c.messages.map(rowHTML).join('');
 log.scrollTop=log.scrollHeight;
}
function render(){renderList();renderChat()}
function grow(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px'}
async function send(){
 const text=q.value.trim();if(!text||busy)return;
 if(!active())newChat();
 const c=active();
 const history=c.messages.slice(-10).map(m=>({role:m.role,content:m.content}));
 c.messages.push({role:'user',content:text});
 if(!c.title)c.title=text.length>38?text.slice(0,38)+'…':text;
 save();q.value='';grow();busy=true;go.disabled=true;
 renderList();renderChat();
 col.insertAdjacentHTML('beforeend','<div class="row bot" id="wait"><div class="ava">M</div><div class="bubble"><div class="body"><span class="dots"><span></span><span></span><span></span></span></div></div></div>');
 log.scrollTop=log.scrollHeight;
 try{
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,history})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.detail||'Server error');
  c.messages.push({role:'assistant',content:d.answer,analysis:d.analysis});
  save();
 }catch(err){
  const w=document.getElementById('wait');
  if(w)w.querySelector('.body').textContent='Error: '+err.message;
  busy=false;go.disabled=false;return;
 }
 busy=false;go.disabled=false;
 if(activeId===c.id)renderChat();
 q.focus();
}
go.onclick=send;
q.addEventListener('input',grow);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.getElementById('new').onclick=newChat;
document.getElementById('burger').onclick=()=>document.body.classList.add('open');
document.getElementById('ov').onclick=()=>document.body.classList.remove('open');
chats=chats.filter(c=>c.messages.length);
if(chats.length){activeId=chats[0].id;render()}else{newChat()}
</script>
</body>
</html>
